<text x="110" y="825" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412">Belangrijk</text>
<text x="245" y="825" font-family="Arial,sans-serif" font-size="17" fill="#7c2d12">D1→A0, D2→A1, … D8→A7. De huidige EPLAN-pagina 3 toont dit nog omgekeerd en moet worden gecorrigeerd.</text>
<text x="110" y="850" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">Eventuele IR/LED-enable-aansluiting: behoud de aansluiting van de exacte HY-S301-module; deze tekening toont de acht analoge signaalpinnen.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<rect width="1500" height="1050" fill="#fff"/>
<style>
.title{font:700 34px Arial;fill:#17212b}.sub{font:18px Arial;fill:#526170}
.box{fill:#f5f8fc;stroke:#334155;stroke-width:3}.drv{fill:#eef6ff;stroke:#1d4ed8;stroke-width:3}
.motor{fill:#f8fafc;stroke:#334155;stroke-width:3}.power{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
.t{font:700 24px Arial;fill:#17212b}.pin{font:19px Arial;fill:#17212b}.small{font:16px Arial;fill:#475569}
.signal{stroke:#2563eb;stroke-width:4;fill:none}.gnd{stroke:#475569;stroke-width:4;fill:none}.vm{stroke:#c2410c;stroke-width:4;fill:none}
</style>
<text class="title" x="60" y="65">H-brug-POC — Arduino Nano + DRV8833</text>
<text class="sub" x="60" y="105">Onafhankelijke PWM en draairichting voor twee DC-motoren · functioneel aansluitschema</text>
<rect class="box" x="60" y="190" width="330" height="490" rx="18"/>
<text class="t" x="225" y="235" text-anchor="middle">Arduino Nano</text>
<text class="pin" x="105" y="315">D11 — links IN1</text><text class="pin" x="105" y="375">D10 — links IN2</text>
<text class="pin" x="105" y="475">D6 — rechts IN3</text><text class="pin" x="105" y="535">D5 — rechts IN4</text><text class="pin" x="105" y="625">GND</text>
<rect class="drv" x="575" y="190" width="390" height="490" rx="18"/>
<text class="t" x="770" y="235" text-anchor="middle">DRV8833-module</text><text class="small" x="770" y="265" text-anchor="middle">Dubbele H-brug</text>
<text class="pin" x="620" y="315">AIN1 / IN1</text><text class="pin" x="620" y="375">AIN2 / IN2</text>
<text class="pin" x="620" y="475">BIN1 / IN3</text><text class="pin" x="620" y="535">BIN2 / IN4</text>
<text class="pin" x="620" y="605">VM (motor +)</text><text class="pin" x="620" y="650">GND</text>
<text class="small" x="800" y="315">AOUT1 / AOUT2</text><text class="small" x="800" y="475">BOUT1 / BOUT2</text>
<rect class="motor" x="1120" y="270" width="315" height="125" rx="16"/><text class="t" x="1277" y="320" text-anchor="middle">Linkermotor</text><text class="small" x="1277" y="355" text-anchor="middle">Kanaal A · twee motordraden</text>
<rect class="motor" x="1120" y="450" width="315" height="125" rx="16"/><text class="t" x="1277" y="500" text-anchor="middle">Rechtermotor</text><text class="small" x="1277" y="535" text-anchor="middle">Kanaal B · twee motordraden</text>
<rect class="power" x="60" y="755" width="330" height="130" rx="14"/><text class="t" x="225" y="800" text-anchor="middle">2S LiPo</text><text class="pin" x="95" y="840">+ naar VM · − naar GND</text>
<rect class="power" x="575" y="755" width="390" height="130" rx="14"/><text class="t" x="770" y="800" text-anchor="middle">Motorvoeding</text><text class="pin" x="620" y="840">470 µF tussen VM en GND</text>
<path class="signal" d="M390 315 H575"/><path class="signal" d="M390 375 H575"/><path class="signal" d="M390 475 H575"/><path class="signal" d="M390 535 H575"/>
<path class="signal" d="M965 315 H1120"/><path class="signal" d="M965 475 H1120"/>
<path class="vm" d="M390 820 H575"/><path class="vm" d="M770 755 V680"/>
<path class="gnd" d="M390 625 H480 V650 H575"/><path class="gnd" d="M390 855 H500 V650 H575"/>
<text class="small" x="60" y="945">Nano-GND, DRV8833-GND en batterij-min moeten gemeenschappelijk verbonden zijn.</text>
<text class="small" x="60" y="975">Nano krijgt 5 V via de buckconverter; VM krijgt rechtstreeks de 2S-motorvoeding.</text>
<text class="small" x="60" y="1005">SLEEP/nSLEEP (indien aanwezig): activeer volgens de modulemarkering en EPLAN-aansluiting.</text>
<text class="small" x="1000" y="700">Plaats 100 nF over elke motor.</text><text class="small" x="1000" y="730">Controleer polariteit en modulepinout.</text><text class="small" x="1000" y="760">Dit is geen fysieke connectorlayout.</text>
</svg>
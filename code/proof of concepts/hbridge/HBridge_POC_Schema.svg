<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<rect width="1500" height="980" fill="#ffffff"/>
<text x="65" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">H-brug-POC — Arduino Nano + DRV8833</text>
<text x="65" y="110" font-family="Arial,sans-serif" font-size="18" fill="#526170">Twee DC-motoren onafhankelijk regelen met PWM en beide draairichtingen</text>
<rect x="65" y="210" width="310" height="500" rx="18" fill="#f5f8fb" stroke="#334155" stroke-width="3"/>
<text x="220" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17212b">Arduino Nano</text>
<text x="220" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526170">PWM-signalen</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#17212b">
<text x="105" y="365">D11</text><text x="105" y="425">D10</text><text x="105" y="515">D6</text><text x="105" y="575">D5</text><text x="105" y="665">GND</text>
</g>
<rect x="555" y="205" width="390" height="520" rx="18" fill="#eef6ff" stroke="#1d4ed8" stroke-width="3"/>
<text x="750" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17212b">DRV8833</text>
<text x="750" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526170">Dual H-bridge module</text>
<g font-family="Arial,sans-serif" font-size="20" fill="#17212b">
<text x="600" y="365">IN1</text><text x="600" y="425">IN2</text><text x="600" y="515">IN3</text><text x="600" y="575">IN4</text>
<text x="810" y="365">OUT A1 / A2</text><text x="810" y="515">OUT B1 / B2</text>
<text x="600" y="645">VCC / VM</text><text x="600" y="690">GND</text>
</g>
<rect x="1135" y="280" width="290" height="150" rx="15" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="1280" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">Linkermotor</text>
<text x="1280" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526170">Motor A · twee motordraden</text>
<rect x="1135" y="475" width="290" height="150" rx="15" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<text x="1280" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">Rechtermotor</text>
<text x="1280" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526170">Motor B · twee motordraden</text>
<g stroke="#111827" stroke-width="3.5" fill="none">
<path d="M375 355 H555"/><path d="M375 415 H555"/><path d="M375 505 H555"/><path d="M375 565 H555"/>
<path d="M945 355 H1135"/><path d="M945 505 H1135"/>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#334155">
<text x="455" y="342" text-anchor="middle">D11 → IN1</text><text x="455" y="402" text-anchor="middle">D10 → IN2</text><text x="455" y="492" text-anchor="middle">D6 → IN3</text><text x="455" y="552" text-anchor="middle">D5 → IN4</text>
<text x="1040" y="340" text-anchor="middle">Motoruitgang A</text><text x="1040" y="490" text-anchor="middle">Motoruitgang B</text>
</g>
<rect x="65" y="775" width="310" height="125" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="220" y="812" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#9a3412">5V voor Nano</text>
<text x="220" y="845" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">Gereguleerde voeding</text>
<text x="220" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">of USB tijdens de POC</text>
<rect x="555" y="775" width="390" height="125" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="750" y="812" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#9a3412">2S LiPo via hoofdschakelaar</text>
<text x="750" y="845" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">Motorvoeding naar VCC/VM</text>
<text x="750" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7c2d12">470 µF tussen motorvoeding en GND</text>
<g stroke="#2563eb" stroke-width="3" fill="none">
<path d="M375 835 H460 V690 H555"/>
<path d="M750 775 V645"/>
</g>
<g stroke="#111827" stroke-width="3" fill="none">
<path d="M375 665 H460 V690 H555"/>
<path d="M945 690 H1030 V665"/>
<path d="M1030 665 V835 H945"/>
</g>
<text x="1070" y="865" font-family="Arial,sans-serif" font-size="15" fill="#334155">Alle GND's gemeenschappelijk</text>
<rect x="1010" y="690" width="415" height="75" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="1217" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">100 nF per motor</text>
<text x="1217" y="746" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#166534">Condensator over de motorklemmen</text>
<text x="65" y="940" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Functioneel POC-schema, geen fysieke pinouttekening van een specifieke DRV8833-breakout. Volg de modulemarkeringen en het actuele EPLAN-blad 4 voor de connectorposities.</text>
</svg>
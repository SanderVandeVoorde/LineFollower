<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="1500" height="900" fill="#fff"/>
<style>.title{font:700 34px Arial;fill:#17212b}.sub{font:18px Arial;fill:#526170}.box{fill:#f5f8fc;stroke:#334155;stroke-width:3}.esp{fill:#eef6ff;stroke:#1d4ed8;stroke-width:3}.t{font:700 25px Arial;fill:#17212b}.pin{font:19px Arial;fill:#17212b}.small{font:16px Arial;fill:#475569}.sig{stroke:#2563eb;stroke-width:4;fill:none}.gnd{stroke:#475569;stroke-width:4;fill:none}.wifi{stroke:#0f766e;stroke-width:4;stroke-dasharray:10 8;fill:none}</style>
<text class="title" x="60" y="65">Draadloze communicatie-POC — Wi-Fi + UART</text><text class="sub" x="60" y="105">Browser ↔ ESP32-C3 accesspoint ↔ UART ↔ Arduino Nano</text>
<rect class="box" x="70" y="250" width="360" height="360" rx="18"/><text class="t" x="250" y="300" text-anchor="middle">Arduino Nano</text><text class="pin" x="115" y="390">D1 / TX (5 V)</text><text class="pin" x="115" y="470">D0 / RX (3,3 V HIGH)</text><text class="pin" x="115" y="550">GND</text>
<rect class="esp" x="600" y="220" width="390" height="420" rx="18"/><text class="t" x="795" y="275" text-anchor="middle">ESP32-C3 Super Mini</text><text class="pin" x="650" y="375">GPIO20 / RX</text><text class="pin" x="650" y="455">GPIO21 / TX</text><text class="pin" x="650" y="555">GND</text><text class="small" x="650" y="600">3,3 V-logica</text>
<rect class="box" x="1150" y="290" width="285" height="220" rx="18"/><text class="t" x="1292" y="345" text-anchor="middle">Browser</text><text class="pin" x="1180" y="410">Laptop / smartphone</text><text class="small" x="1180" y="455">HTTP-dashboard</text>
<path class="sig" d="M430 390 H600"/><path class="sig" d="M600 455 H430"/><path class="gnd" d="M430 550 H520 V555 H600"/><path class="wifi" d="M990 390 H1150"/>
<text class="small" x="480" y="365" text-anchor="middle">10 kΩ serie</text><text class="small" x="500" y="420" text-anchor="middle">20 kΩ naar GND</text><text class="small" x="1050" y="365" text-anchor="middle">Wi-Fi 2,4 GHz</text>
<rect x="65" y="700" width="1370" height="125" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text class="t" x="95" y="745">Belangrijke elektrische regels</text><text class="small" x="95" y="785">Nano-TX is 5 V: gebruik de 10 kΩ / 20 kΩ-spanningsdeler vóór ESP32 GPIO20/RX.</text><text class="small" x="95" y="810">ESP32 GPIO21/TX gaat naar Nano D0/RX; verbind GND gemeenschappelijk. Voed elk bord volgens de eigen pinout.</text></svg>
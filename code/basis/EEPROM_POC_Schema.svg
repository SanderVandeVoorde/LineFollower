<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#fff"/>
<style>.title{font:700 32px Arial;fill:#17212b}.sub{font:18px Arial;fill:#526170}.box{fill:#f5f8fc;stroke:#334155;stroke-width:3}.mem{fill:#eef6ff;stroke:#1d4ed8;stroke-width:3}.t{font:700 25px Arial;fill:#17212b}.pin{font:19px Arial;fill:#17212b}.small{font:16px Arial;fill:#475569}.wire{stroke:#2563eb;stroke-width:4;fill:none}</style>
<text class="title" x="60" y="65">EEPROM-POC — niet-vluchtige instellingen</text><text class="sub" x="60" y="105">De gegevens worden intern in de ATmega328P bewaard; er is geen externe EEPROM-chip nodig.</text>
<rect class="box" x="70" y="220" width="380" height="270" rx="18"/><text class="t" x="260" y="275" text-anchor="middle">Arduino Nano</text><text class="pin" x="115" y="350">Basisprogramma</text><text class="small" x="115" y="395">CYCLE / DEBUG / SAVE / STATUS</text><text class="small" x="115" y="440">USB-seriële monitor</text>
<rect class="mem" x="700" y="220" width="420" height="270" rx="18"/><text class="t" x="910" y="275" text-anchor="middle">Interne EEPROM</text><text class="pin" x="755" y="350">cycleTimeMs</text><text class="pin" x="755" y="395">debugEnabled</text><text class="small" x="755" y="445">magic + validatieversie</text><path class="wire" d="M450 355 H700"/><text class="small" x="575" y="330" text-anchor="middle">EEPROM.put / get</text>
<rect x="70" y="555" width="1050" height="75" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text class="small" x="100" y="600">Test: wijzig instelling → SAVE → reset Nano → STATUS. De waarden moeten na herstart behouden blijven.</text></svg>